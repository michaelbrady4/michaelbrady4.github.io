# Nightly library sync for Goodreads, Letterboxd, and YouTube.
# None of these need secrets. YouTube runs only when youtube.json has a playlist id.
# See docs/library-setup.md.

name: Update library

on:
  schedule:
    - cron: "15 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: library-sync
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check library parsers
        run: npm run test:unit
      - name: Fetch library data
        id: sync
        run: node scripts/library/update.mjs
        continue-on-error: true
      - name: Commit library data
        if: steps.sync.outcome == 'success' || steps.sync.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/library/reading.json src/data/library/watching.json src/data/library/youtube.json
          if git diff --staged --quiet; then
            echo "No library changes."
          else
            git commit -m "Update library data"
            git push
          fi
      - name: Fail when the sync failed
        if: steps.sync.outcome == 'failure'
        run: exit 1
